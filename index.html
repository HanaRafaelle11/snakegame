<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake AAA FIX</title>

<style>
body{
margin:0;
background:radial-gradient(circle at top,#0f172a,#020617);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:system-ui;
color:white;
}

.container{text-align:center;}

canvas{
background:#0b1220;
border-radius:18px;
box-shadow:0 30px 80px rgba(0,0,0,.7);
touch-action:none;
}

.hud{
display:flex;
justify-content:space-between;
width:420px;
margin:10px auto;
font-size:14px;
opacity:.9;
}

button{
border:none;
border-radius:12px;
padding:10px 14px;
font-weight:bold;
background:#38bdf8;
cursor:pointer;
}

button:active{transform:scale(.95);}

/* D-PAD AAA */
.dpad{
margin-top:14px;
display:grid;
grid-template-columns:90px 90px 90px;
grid-template-rows:90px 90px 90px;
gap:10px;
justify-content:center;
}

.dpad button{
width:90px;
height:90px;
font-size:30px;
background:rgba(255,255,255,.06);
color:white;
border-radius:18px;
}

.dpad button:active{
background:rgba(255,255,255,.18);
transform:scale(.9);
}

.empty{visibility:hidden;}

@media(min-width:768px){
.dpad{display:none;}
}
</style>
</head>

<body>

<div class="container">

<div class="hud">
<div>Score: <span id="score">0</span></div>
<div>Level: <span id="level">1</span></div>
</div>

<canvas id="game"></canvas>

<button onclick="togglePause()">⏸ Pause</button>

<div class="dpad">

<div class="empty"></div>
<button data-dir="up">⬆</button>
<div class="empty"></div>

<button data-dir="left">⬅</button>
<div class="empty"></div>
<button data-dir="right">➡</button>

<div class="empty"></div>
<button data-dir="down">⬇</button>
<div class="empty"></div>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

// ================= STATE =================
let snake,food,dir,nextDir;
let score=0,level=1;
let speed=140,last=0;
let paused=false;

// ================= AUDIO =================
function beep(f){
const a=new (AudioContext||webkitAudioContext)();
const o=a.createOscillator();
o.frequency.value=f;
o.connect(a.destination);
o.start();
o.stop(a.currentTime+0.08);
}

// ================= VIBRATION =================
function vib(ms){
if(navigator.vibrate) navigator.vibrate(ms);
}

// ================= RESET =================
function reset(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dir={x:1,y:0};
nextDir=dir;

score=0;
level=1;
speed=140;

document.getElementById("score").textContent=0;
document.getElementById("level").textContent=1;

spawn();
}

function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

// ================= MOVE =================
function move(){

dir=nextDir;

let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some(s=>s.x===h.x&&s.y===h.y)){
beep(120);
vib(150);
reset();
return;
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){
score++;
document.getElementById("score").textContent=score;

beep(600);
vib(30);

if(score%5===0){
level++;
document.getElementById("level").textContent=level;
speed=Math.max(60,speed-8);
beep(900);
}

spawn();
}else{
snake.pop();
}
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,420,420);

// food
ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,20,20);

// snake
snake.forEach((s,i)=>{
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(s.x*20,s.y*20,20,20);
});
}

// ================= LOOP =================
function loop(t){

if(!paused){
if(t-last>speed){
move();
last=t;
}
}

draw();
requestAnimationFrame(loop);
}

// ================= INPUT =================
document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") nextDir={x:0,y:-1};
if(e.key==="ArrowDown") nextDir={x:0,y:1};
if(e.key==="ArrowLeft") nextDir={x:-1,y:0};
if(e.key==="ArrowRight") nextDir={x:1,y:0};

if(e.code==="Space") paused=!paused;
});

// ================= D-PAD FIXED =================
document.querySelectorAll("[data-dir]").forEach(btn=>{
btn.addEventListener("click",()=>{

const d=btn.getAttribute("data-dir");

if(d==="up") nextDir={x:0,y:-1};
if(d==="down") nextDir={x:0,y:1};
if(d==="left") nextDir={x:-1,y:0};
if(d==="right") nextDir={x:1,y:0};

beep(300);
vib(20);
});
});

// ================= START =================
reset();
requestAnimationFrame(loop);

</script>

</body>
</html>
