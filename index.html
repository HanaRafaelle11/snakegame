<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Final Fix</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b1220;
font-family:system-ui;
color:white;
overflow:hidden;
}

.app{
width:100%;
max-width:460px;
text-align:center;
padding:10px;
}

.screen{display:none;}
.screen.active{display:block;}

.hud{
display:flex;
justify-content:space-between;
padding:10px;
font-size:14px;
background:rgba(255,255,255,.06);
border-radius:10px;
margin-bottom:10px;
}

canvas{
width:100%;
max-width:420px;
aspect-ratio:1;
background:#0f172a;
border-radius:16px;
display:block;
margin:auto;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
background:#38bdf8;
font-weight:bold;
margin-top:10px;
}

/* DPAD */
.dpad{
display:grid;
grid-template-columns:80px 80px 80px;
grid-template-rows:80px 80px 80px;
gap:10px;
justify-content:center;
margin-top:10px;
}

.dpad button{
width:80px;
height:80px;
border-radius:16px;
border:none;
background:rgba(255,255,255,.08);
color:white;
font-size:24px;
}

.dpad div{width:80px;height:80px;}

@media(min-width:768px){
.dpad{display:none;}
}
</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div id="menu" class="screen active">
<h1>🐍 Snake</h1>
<button onclick="start()">Jogar</button>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="hud">
<div>Score: <span id="score">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>Best: <span id="best">0</span></div>
</div>

<canvas id="c"></canvas>

<button onclick="pause()">Pause</button>

<div class="dpad">
<div></div>
<button data-dir="up">⬆</button>
<div></div>

<button data-dir="left">⬅</button>
<div></div>
<button data-dir="right">➡</button>

<div></div>
<button data-dir="down">⬇</button>
<div></div>
</div>

</div>

<!-- GAME OVER -->
<div id="over" class="screen">
<h1>Game Over</h1>
<button onclick="start()">Reiniciar</button>
</div>

</div>

<script>

// ================= CANVAS =================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

// ================= UI =================
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const over=document.getElementById("over");

// ================= STATE =================
let snake,food,dir,next;
let score=0,level=1,best=localStorage.getItem("best")||0;
let speed=140,last=0;
let running=false,paused=false;

// ================= AUDIO FIX =================
let audio=null;

function unlockAudio(){
if(!audio){
audio=new (window.AudioContext||window.webkitAudioContext)();
}
}

function beep(freq){
if(!audio) return;
const o=audio.createOscillator();
const g=audio.createGain();
o.frequency.value=freq;
g.gain.value=0.08;
o.connect(g);
g.connect(audio.destination);
o.start();
o.stop(audio.currentTime+0.08);
}

// ================= SCREEN =================
function show(s){
menu.classList.remove("active");
game.classList.remove("active");
over.classList.remove("active");
s.classList.add("active");
}

// ================= START =================
function start(){

unlockAudio();

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dir={x:1,y:0};
next=dir;

score=0;
level=1;
speed=140;
paused=false;
running=true;

document.getElementById("score").textContent=0;
document.getElementById("level").textContent=1;
document.getElementById("best").textContent=best;

spawn();
show(game);
}

// ================= SPAWN =================
function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

// ================= GAME OVER =================
function gameOver(){

running=false;

if(score>best){
best=score;
localStorage.setItem("best",best);
}

beep(120);
show(over);
}

// ================= UPDATE =================
function update(){

dir=next;

let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(
h.x<0||h.y<0||h.x>=20||h.y>=20||
snake.some(s=>s.x===h.x&&s.y===h.y)
){
gameOver();
return;
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){

score++;
document.getElementById("score").textContent=score;

beep(600);

if(score%5===0){
level++;
document.getElementById("level").textContent=level;
speed=Math.max(60,speed-10);
beep(900);
}

spawn();

}else{
snake.pop();
}
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,420,420);

ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,20,20);

snake.forEach((s,i)=>{
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(s.x*20,s.y*20,20,20);
});
}

// ================= LOOP =================
function loop(t){

requestAnimationFrame(loop);

if(!running || paused){
draw();
return;
}

if(t-last>speed){
update();
last=t;
}

draw();
}

// ================= PAUSE =================
function pause(){
paused=!paused;
}

// ================= KEYBOARD =================
document.addEventListener("keydown",e=>{

unlockAudio();

if(e.key==="ArrowUp") next={x:0,y:-1};
if(e.key==="ArrowDown") next={x:0,y:1};
if(e.key==="ArrowLeft") next={x:-1,y:0};
if(e.key==="ArrowRight") next={x:1,y:0};

if(e.code==="Space") pause();
});

// ================= MOBILE =================
document.querySelectorAll("[data-dir]").forEach(b=>{
b.addEventListener("click",()=>{

unlockAudio();

let d=b.dataset.dir;

if(d==="up") next={x:0,y:-1};
if(d==="down") next={x:0,y:1};
if(d==="left") next={x:-1,y:0};
if(d==="right") next={x:1,y:0};

beep(300);

});
});

// ================= INIT =================
spawn();
show(menu);
requestAnimationFrame(loop);

</script>

</body>
</html>
