<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">

<title>Snake Pro Product</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{text-align:center;}

canvas{
background:#0f172a;
border-radius:12px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.hud{
display:flex;
justify-content:space-between;
width:420px;
margin:10px auto;
font-size:14px;
}

.bar{
height:6px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-top:4px;
}

.fill{
height:100%;
width:0%;
background:#38bdf8;
transition:.2s;
}

.overlay{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
gap:10px;
background:rgba(0,0,0,.8);
}

.overlay.show{display:flex;}

button{
padding:10px 16px;
border:none;
border-radius:10px;
background:#38bdf8;
cursor:pointer;
font-weight:bold;
}

.mobile{
margin-top:10px;
display:grid;
grid-template-columns:repeat(3,60px);
gap:8px;
justify-content:center;
}

@media(min-width:768px){
.mobile{display:none;}
}
</style>
</head>

<body>

<div class="container">

<div class="hud">
<div>Score: <span id="score">0</span></div>
<div>Level: <span id="level">1</span></div>
</div>

<div class="bar">
<div id="xp" class="fill"></div>
</div>

<canvas id="game"></canvas>

<div id="start" class="overlay show">
<h1>🐍 Snake Pro Product</h1>
<button onclick="start()">Start</button>
</div>

<div id="gameover" class="overlay">
<h1>Game Over</h1>
<button onclick="reset()">Restart</button>
</div>

<button onclick="togglePause()">Pause</button>

<div class="mobile">
<button data="up">⬆</button>
<button data="left">⬅</button>
<button data="right">➡</button>
<button data="down">⬇</button>
</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

let snake,food,dir,nextDir;
let score=0;
let level=1;
let xp=0;
let state="start";
let paused=false;
let speed=140;
let last=0;

const xpBar=document.getElementById("xp");

const save=()=>{
localStorage.setItem("snake_prod",JSON.stringify({
score,level
}));
};

const load=()=>{
let d=JSON.parse(localStorage.getItem("snake_prod"));
if(d){
score=d.score||0;
level=d.level||1;
}
};

function sound(f){
let a=new AudioContext();
let o=a.createOscillator();
o.frequency.value=f;
o.connect(a.destination);
o.start();
o.stop(a.currentTime+0.05);
}

function start(){
state="playing";
document.getElementById("start").classList.remove("show");
reset();
}

function reset(){
snake=[{x:10,y:10}];
dir={x:1,y:0};
nextDir=dir;
score=0;
level=1;
xp=0;
speed=140;
spawn();
document.getElementById("gameover").classList.remove("show");
}

function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

function togglePause(){
if(state!=="playing")return;
paused=!paused;
}

function updateXP(){
xp+=10;
if(xp>=100){
xp=0;
level++;
speed=Math.max(60,speed-10);
sound(800);
}
xpBar.style.width=xp+"%";
}

function move(){
dir=nextDir;

let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some(s=>s.x===h.x&&s.y===h.y)){
sound(120);
state="gameover";
document.getElementById("gameover").classList.add("show");
save();
return;
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){
score++;
updateXP();
sound(600);
spawn();
}else{
snake.pop();
}
}

function draw(){
ctx.fillStyle="#0f172a";
ctx.fillRect(0,0,420,420);

ctx.fillStyle="#ef4444";
ctx.fillRect(food.x*20,food.y*20,20,20);

snake.forEach((s,i)=>{
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(s.x*20,s.y*20,20,20);
});
}

function loop(t){
if(state==="playing"&&!paused){
if(t-last>speed){
move();
last=t;
}
}
draw();
requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
if(e.code==="Enter"&&state==="start") start();

if(state!=="playing")return;

if(e.key==="ArrowUp")nextDir={x:0,y:-1};
if(e.key==="ArrowDown")nextDir={x:0,y:1};
if(e.key==="ArrowLeft")nextDir={x:-1,y:0};
if(e.key==="ArrowRight")nextDir={x:1,y:0};

if(e.code==="Space")togglePause();
});

document.querySelectorAll("[data]").forEach(b=>{
b.onclick=()=>{
let d=b.getAttribute("data");
if(d==="up")nextDir={x:0,y:-1};
if(d==="down")nextDir={x:0,y:1};
if(d==="left")nextDir={x:-1,y:0};
if(d==="right")nextDir={x:1,y:0};
};
});

load();
requestAnimationFrame(loop);
</script>

</body>
</html>
