<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake FIX Stable</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b1220;
font-family:system-ui;
color:white;
overflow:hidden;
}

.app{
width:100%;
max-width:460px;
text-align:center;
padding:10px;
}

.screen{display:none;}
.screen.active{display:block;}

canvas{
width:100%;
max-width:420px;
aspect-ratio:1;
background:#0f172a;
border-radius:16px;
display:block;
margin:auto;
}

button{
padding:12px 16px;
border:none;
border-radius:12px;
background:#38bdf8;
font-weight:bold;
margin-top:10px;
}

/* DPAD SEMPRE VISÍVEL NO MOBILE */
.dpad{
display:grid;
grid-template-columns:80px 80px 80px;
grid-template-rows:80px 80px 80px;
gap:10px;
justify-content:center;
margin-top:10px;
}

.dpad button{
width:80px;
height:80px;
border-radius:16px;
border:none;
background:rgba(255,255,255,.08);
color:white;
font-size:24px;
}

.dpad div{width:80px;height:80px;}

@media(min-width:768px){
.dpad{display:none;}
}
</style>
</head>

<body>

<div class="app">

<div id="menu" class="screen active">
<h1>🐍 Snake</h1>
<button onclick="start()">Jogar</button>
</div>

<div id="game" class="screen">

<canvas id="c"></canvas>

<div>Score: <span id="score">0</span></div>

<button onclick="pause()">Pause</button>

<div class="dpad">
<div></div>
<button data-dir="up">⬆</button>
<div></div>

<button data-dir="left">⬅</button>
<div></div>
<button data-dir="right">➡</button>

<div></div>
<button data-dir="down">⬇</button>
<div></div>
</div>

</div>

<div id="over" class="screen">
<h1>Game Over</h1>
<button onclick="start()">Reiniciar</button>
</div>

</div>

<script>

// ================= CANVAS =================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

// ================= SCREENS =================
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const over=document.getElementById("over");

// ================= STATE =================
let snake=[];
let food={x:10,y:10};
let dir={x:1,y:0};
let next={x:1,y:0};
let running=false;
let paused=false;
let last=0;
let speed=140;
let score=0;

// ================= AUDIO SAFE =================
let audio=null;

function beep(freq){
try{
if(!audio){
audio=new (window.AudioContext||window.webkitAudioContext)();
}
let o=audio.createOscillator();
let g=audio.createGain();
o.frequency.value=freq;
g.gain.value=0.1;
o.connect(g);
g.connect(audio.destination);
o.start();
o.stop(audio.currentTime+0.08);
}catch(e){}
}

// ================= UI =================
function show(s){
menu.classList.remove("active");
game.classList.remove("active");
over.classList.remove("active");
s.classList.add("active");
}

// ================= START =================
function start(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dir={x:1,y:0};
next={x:1,y:0};

score=0;
paused=false;
running=true;

document.getElementById("score").textContent=0;

spawn();
show(game);

draw();
}

// ================= SPAWN =================
function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

// ================= GAME OVER =================
function gameOver(){
running=false;
beep(120);
show(over);
}

// ================= UPDATE =================
function update(){

dir=next;

let h={
x:snake[0].x+dir.x,
y:snake[0].y+dir.y
};

if(
h.x<0||h.y<0||h.x>=20||h.y>=20||
snake.some(s=>s.x===h.x&&s.y===h.y)
){
gameOver();
return;
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){
score++;
document.getElementById("score").textContent=score;
beep(600);
spawn();
}else{
snake.pop();
}
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,420,420);

ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,20,20);

for(let i=0;i<snake.length;i++){
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(snake[i].x*20,snake[i].y*20,20,20);
}
}

// ================= LOOP =================
function loop(t){

requestAnimationFrame(loop);

if(!running){
draw();
return;
}

if(paused) return;

if(t-last>speed){
update();
last=t;
}

draw();
}

// ================= PAUSE =================
function pause(){
paused=!paused;
}

// ================= KEYBOARD =================
document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") next={x:0,y:-1};
if(e.key==="ArrowDown") next={x:0,y:1};
if(e.key==="ArrowLeft") next={x:-1,y:0};
if(e.key==="ArrowRight") next={x:1,y:0};

if(e.code==="Space") pause();
});

// ================= MOBILE =================
document.querySelectorAll("[data-dir]").forEach(b=>{
b.addEventListener("click",()=>{

let d=b.dataset.dir;

if(d==="up") next={x:0,y:-1};
if(d==="down") next={x:0,y:1};
if(d==="left") next={x:-1,y:0};
if(d==="right") next={x:1,y:0};

beep(300);

});
});

// ================= INIT =================
spawn();
show(menu);
requestAnimationFrame(loop);

</script>

</body>
</html>
