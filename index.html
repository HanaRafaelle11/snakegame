<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake FIXED</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0b1220;
font-family:system-ui;
color:white;
overflow:hidden;
}

.app{width:100%;max-width:460px;text-align:center}

.screen{display:none}
.screen.active{display:block}

canvas{
width:100%;
max-width:420px;
aspect-ratio:1;
background:#0f172a;
border-radius:16px;
display:block;
margin:0 auto;
}

button{
padding:12px 16px;
border:none;
border-radius:10px;
background:#38bdf8;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<div id="menu" class="screen active">
<h1>Snake</h1>
<button onclick="startGame()">Jogar</button>
</div>

<div id="game" class="screen">
<canvas id="c"></canvas>
<div>Score: <span id="score">0</span></div>
<button onclick="togglePause()">Pause</button>
</div>

<div id="over" class="screen">
<h1>Game Over</h1>
<button onclick="startGame()">Reiniciar</button>
</div>

</div>

<script>

// ================= CANVAS =================
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

// ================= UI =================
const menu=document.getElementById("menu");
const game=document.getElementById("game");
const over=document.getElementById("over");

// ================= STATE =================
let snake=[];
let food={x:5,y:5};
let dir={x:1,y:0};
let nextDir={x:1,y:0};
let score=0;
let state="menu";
let paused=false;
let last=0;
let speed=140;

// ================= SCREEN =================
function show(s){
menu.classList.remove("active");
game.classList.remove("active");
over.classList.remove("active");
s.classList.add("active");
}

// ================= START (FORÇA TUDO) =================
function startGame(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dir={x:1,y:0};
nextDir={x:1,y:0};

score=0;
paused=false;
state="play";

document.getElementById("score").textContent=0;

spawn();

// 🔥 IMPORTANTE: desenha IMEDIATO (evita tela preta)
draw();

show(game);
}

// ================= SPAWN =================
function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

// ================= UPDATE =================
function update(){

dir=nextDir;

const head={
x:snake[0].x+dir.x,
y:snake[0].y+dir.y
};

// colisão
if(
head.x<0||head.y<0||head.x>=20||head.y>=20||
snake.some(s=>s.x===head.x&&s.y===head.y)
){
state="over";
show(over);
return;
}

snake.unshift(head);

if(head.x===food.x&&head.y===food.y){
score++;
document.getElementById("score").textContent=score;
spawn();
}else{
snake.pop();
}
}

// ================= DRAW (SEMPRE SEGURA) =================
function draw(){

ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,420,420);

// comida (sempre desenha)
ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,20,20);

// cobra (sempre desenha)
for(let i=0;i<snake.length;i++){
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(snake[i].x*20,snake[i].y*20,20,20);
}
}

// ================= LOOP (NUNCA PARA) =================
function loop(t){

requestAnimationFrame(loop);

// sempre desenha (evita tela preta)
draw();

if(state!=="play") return;

if(paused) return;

if(t-last>speed){
update();
last=t;
}
}

// ================= PAUSE =================
function togglePause(){
paused=!paused;
}

// ================= INPUT =================
document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") nextDir={x:0,y:-1};
if(e.key==="ArrowDown") nextDir={x:0,y:1};
if(e.key==="ArrowLeft") nextDir={x:-1,y:0};
if(e.key==="ArrowRight") nextDir={x:1,y:0};

if(e.code==="Space") togglePause();
});

// ================= INIT ABSOLUTO =================
spawn();
draw();
show(menu);
requestAnimationFrame(loop);

</script>

</body>
</html>
