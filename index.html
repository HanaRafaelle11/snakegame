<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake AAA</title>

<style>
body{
margin:0;
background:radial-gradient(circle at top,#0f172a,#020617);
font-family:system-ui;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{text-align:center;}

canvas{
background:#0b1220;
border-radius:18px;
box-shadow:0 30px 80px rgba(0,0,0,.7);
touch-action:none;
}

.hud{
display:flex;
justify-content:space-between;
width:420px;
margin:10px auto;
font-size:14px;
opacity:.9;
}

.overlay{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,.85);
backdrop-filter:blur(8px);
}

.overlay.show{display:flex;}

button{
border:none;
border-radius:14px;
padding:12px 16px;
font-weight:700;
background:linear-gradient(135deg,#38bdf8,#2563eb);
color:white;
cursor:pointer;
transition:.15s;
}

button:active{transform:scale(.92);}

/* ================= D-PAD AAA ================= */

.dpad{
margin-top:16px;
display:grid;
grid-template-columns:100px 100px 100px;
grid-template-rows:100px 100px 100px;
gap:10px;
justify-content:center;
}

.dpad button{
width:100px;
height:100px;
font-size:32px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(10px);
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.4);
}

.dpad button:active{
background:rgba(255,255,255,.15);
transform:scale(.9);
}

.empty{visibility:hidden;}

@media(min-width:768px){
.dpad{display:none;}
}
</style>
</head>

<body>

<div class="container">

<div class="hud">
<div>Score: <span id="score">0</span></div>
<div>Level: <span id="level">1</span></div>
</div>

<canvas id="game"></canvas>

<div id="overlay" class="overlay">
<h1 id="title">Snake AAA</h1>
<button id="btn">Start</button>
</div>

<button onclick="togglePause()">⏸ Pause</button>

<div class="dpad">

<div class="empty"></div>
<button data="up">⬆</button>
<div class="empty"></div>

<button data="left">⬅</button>
<div class="empty"></div>
<button data="right">➡</button>

<div class="empty"></div>
<button data="down">⬇</button>
<div class="empty"></div>

</div>

</div>

<script>

// ================= CANVAS =================
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

// ================= STATE MACHINE =================
const STATE={
MENU:"menu",
PLAY:"play",
PAUSE:"pause",
GAMEOVER:"gameover"
};

let state=STATE.MENU;

// ================= GAME STATE =================
let snake,food,dir,nextDir;
let score=0,level=1;
let speed=140,last=0;
let particles=[];

// ================= AUDIO ENGINE (AAA STYLE) =================
const audioCtx=new (window.AudioContext||webkitAudioContext)();

function sound(freq,type="sine",time=0.08){
const o=audioCtx.createOscillator();
const g=audioCtx.createGain();

o.type=type;
o.frequency.value=freq;

g.gain.value=0.1;

o.connect(g);
g.connect(audioCtx.destination);

o.start();
o.stop(audioCtx.currentTime+time);
}

// ================= VIBRATION =================
function vibrate(ms){
if(navigator.vibrate) navigator.vibrate(ms);
}

// ================= INIT =================
function reset(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dir={x:1,y:0};
nextDir=dir;

score=0;
level=1;
speed=140;

document.getElementById("score").textContent=0;
document.getElementById("level").textContent=1;

spawn();
}

function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

// ================= PARTICLES =================
function spawnParticles(x,y){
for(let i=0;i<8;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*2,
vy:(Math.random()-0.5)*2,
life:20
});
}
}

function updateParticles(){
particles.forEach(p=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;
});
particles=particles.filter(p=>p.life>0);
}

function drawParticles(){
ctx.fillStyle="rgba(56,189,248,.8)";
particles.forEach(p=>{
ctx.fillRect(p.x,p.y,3,3);
});
}

// ================= GAME FLOW =================
function start(){
state=STATE.PLAY;
document.getElementById("overlay").classList.remove("show");
reset();
}

function gameOver(){
state=STATE.GAMEOVER;
document.getElementById("title").innerText="Game Over";
document.getElementById("btn").innerText="Restart";
document.getElementById("overlay").classList.add("show");
sound(120,"square",0.2);
vibrate(200);
}

function togglePause(){
if(state===STATE.PLAY){
state=STATE.PAUSE;
}else if(state===STATE.PAUSE){
state=STATE.PLAY;
}
}

// ================= MOVE =================
function move(){

dir=nextDir;

let h={
x:snake[0].x+dir.x,
y:snake[0].y+dir.y
};

if(
h.x<0||h.y<0||h.x>=20||h.y>=20||
snake.some(s=>s.x===h.x&&s.y===h.y)
){
return gameOver();
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){

score++;
document.getElementById("score").textContent=score;

sound(600);
vibrate(25);
spawnParticles(h.x*20,h.y*20);

if(score%5===0){
level++;
document.getElementById("level").textContent=level;
speed=Math.max(55,speed-7);
sound(900);
vibrate(60);
}

spawn();

}else{
snake.pop();
}
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,420,420);

// grid glow
ctx.fillStyle="rgba(255,255,255,.03)";
for(let i=0;i<20;i++){
ctx.fillRect(i*20,0,1,420);
ctx.fillRect(0,i*20,420,1);
}

// food glow
ctx.shadowBlur=25;
ctx.shadowColor="#ef4444";
ctx.fillStyle="#ef4444";
ctx.fillRect(food.x*20,food.y*20,20,20);
ctx.shadowBlur=0;

// snake glow
snake.forEach((s,i)=>{
ctx.shadowBlur=i===0?20:0;
ctx.shadowColor="#22c55e";
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(s.x*20,s.y*20,20,20);
});

drawParticles();
}

// ================= LOOP =================
function loop(t){

if(state===STATE.PLAY){

if(t-last>speed){
move();
last=t;
}

updateParticles();
}

draw();
requestAnimationFrame(loop);
}

// ================= INPUT =================
document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") nextDir={x:0,y:-1};
if(e.key==="ArrowDown") nextDir={x:0,y:1};
if(e.key==="ArrowLeft") nextDir={x:-1,y:0};
if(e.key==="ArrowRight") nextDir={x:1,y:0};

if(e.code==="Space"){
togglePause();
}
});

// ================= D-PAD =================
document.querySelectorAll("[data]").forEach(b=>{
b.addEventListener("click",()=>{
let d=b.dataset.data;
if(d==="up") nextDir={x:0,y:-1};
if(d==="down") nextDir={x:0,y:1};
if(d==="left") nextDir={x:-1,y:0};
if(d==="right") nextDir={x:1,y:0};
});
});

// ================= UI =================
document.getElementById("btn").onclick=()=>{
start();
};

reset();
requestAnimationFrame(loop);

</script>

</body>
</html>
