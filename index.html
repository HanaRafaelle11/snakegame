<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Fixed PRO</title>

<style>
body{
margin:0;
background:#0b1220;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:system-ui;
}

.container{text-align:center;}

canvas{
background:#0f172a;
border-radius:12px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.hud{
display:flex;
justify-content:space-between;
width:400px;
margin:10px auto;
font-size:14px;
}

button{
padding:10px 14px;
margin:5px;
border:none;
border-radius:8px;
background:#38bdf8;
cursor:pointer;
font-weight:bold;
}

.overlay{
position:absolute;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,.8);
}

.overlay.show{display:flex;}

.mobile{
margin-top:10px;
display:grid;
grid-template-columns:repeat(3,60px);
gap:6px;
justify-content:center;
}

@media(min-width:768px){
.mobile{display:none;}
}
</style>
</head>

<body>

<div class="container">

<div class="hud">
<div>Score: <span id="score">0</span></div>
<div>Level: <span id="level">1</span></div>
</div>

<canvas id="game"></canvas>

<div id="overlay" class="overlay">
<h1>Game Over</h1>
<button onclick="reset()">Jogar novamente</button>
</div>

<button onclick="togglePause()">⏸ Pause</button>

<div class="mobile">
<button data="up">⬆</button>
<button data="left">⬅</button>
<button data="right">➡</button>
<button data="down">⬇</button>
</div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 400;
canvas.height = 400;

// ================= STATE =================
let snake = [];
let food = {};
let dir = {x:1,y:0};
let nextDir = {x:1,y:0};

let score = 0;
let level = 1;
let speed = 140;
let lastTime = 0;

let state = "start";
let paused = false;

// ================= INIT =================
function reset(){

snake = [
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
];

dir = {x:1,y:0};
nextDir = {x:1,y:0};

score = 0;
level = 1;
speed = 140;

document.getElementById("score").textContent = score;
document.getElementById("level").textContent = level;

spawn();

document.getElementById("overlay").classList.remove("show");
}

// ================= FOOD =================
function spawn(){
food = {
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

// ================= PAUSE =================
function togglePause(){
paused = !paused;
}

// ================= MOVE =================
function move(){

dir = nextDir;

let head = {
x: snake[0].x + dir.x,
y: snake[0].y + dir.y
};

// wall
if(head.x<0||head.y<0||head.x>=20||head.y>=20){
return gameOver();
}

// self collision
if(snake.some(s=>s.x===head.x && s.y===head.y)){
return gameOver();
}

snake.unshift(head);

// eat
if(head.x === food.x && head.y === food.y){
score++;
document.getElementById("score").textContent = score;

if(score % 5 === 0){
level++;
document.getElementById("level").textContent = level;
speed = Math.max(60, speed - 10);
}

spawn();
}else{
snake.pop();
}
}

// ================= GAME OVER =================
function gameOver(){
document.getElementById("overlay").classList.add("show");
}

// ================= DRAW =================
function draw(){

ctx.fillStyle="#0f172a";
ctx.fillRect(0,0,400,400);

// food
ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,20,20);

// snake
snake.forEach((s,i)=>{
ctx.fillStyle = i===0 ? "#4ade80" : "#22c55e";
ctx.fillRect(s.x*20,s.y*20,20,20);
});
}

// ================= LOOP =================
function loop(t){

if(!paused){

if(t - lastTime > speed){
move();
lastTime = t;
}
}

draw();
requestAnimationFrame(loop);
}

// ================= INPUT =================
document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") nextDir={x:0,y:-1};
if(e.key==="ArrowDown") nextDir={x:0,y:1};
if(e.key==="ArrowLeft") nextDir={x:-1,y:0};
if(e.key==="ArrowRight") nextDir={x:1,y:0};

if(e.code==="Space") togglePause();
});

// mobile
document.querySelectorAll("[data]").forEach(b=>{
b.onclick=()=>{
let d=b.getAttribute("data");
if(d==="up") nextDir={x:0,y:-1};
if(d==="down") nextDir={x:0,y:1};
if(d==="left") nextDir={x:-1,y:0};
if(d==="right") nextDir={x:1,y:0};
};
});

// ================= START =================
reset();
requestAnimationFrame(loop);

</script>

</body>
</html>
