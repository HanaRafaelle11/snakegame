<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake FIX FINAL</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
background:#0b1220;
color:white;
font-family:system-ui;

/* FIX PRINCIPAL */
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* APP */
.app{
width:100%;
max-width:460px;
padding:10px;
text-align:center;
}

/* SCREENS */
.screen{
display:none;
flex-direction:column;
align-items:center;
gap:12px;
}

.screen.active{
display:flex;
}

/* HUD FIX SEM CORTAR */
.hud{
width:100%;
display:flex;
justify-content:space-between;
font-size:14px;
padding:10px;
background:rgba(255,255,255,.06);
border-radius:12px;
}

/* CANVAS FIX */
canvas{
width:100%;
max-width:420px;
aspect-ratio:1;
background:#0f172a;
border-radius:16px;
box-shadow:0 25px 60px rgba(0,0,0,.6);
touch-action:none;
}

/* BUTTON */
button{
padding:12px 16px;
border:none;
border-radius:12px;
background:#38bdf8;
font-weight:bold;
cursor:pointer;
}

button:active{transform:scale(.95);}

/* DPAD */
.dpad{
margin-top:10px;
display:grid;
grid-template-columns:80px 80px 80px;
grid-template-rows:80px 80px 80px;
gap:8px;
justify-content:center;
}

.dpad button{
width:80px;
height:80px;
font-size:26px;
background:rgba(255,255,255,.06);
color:white;
border-radius:14px;
}

.empty{visibility:hidden;}

@media(min-width:768px){
.dpad{display:none;}
}
</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div id="menu" class="screen active">
<h1>🐍 Snake</h1>
<p>Pressione jogar</p>
<button onclick="startGame()">Jogar</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div class="hud">
<div>Score: <span id="score">0</span></div>
<div>Level: <span id="level">1</span></div>
<div>High: <span id="high">0</span></div>
</div>

<canvas id="game"></canvas>

<button onclick="togglePause()">⏸ Pause</button>

<div class="dpad">

<div class="empty"></div>
<button data-dir="up">⬆</button>
<div class="empty"></div>

<button data-dir="left">⬅</button>
<div class="empty"></div>
<button data-dir="right">➡</button>

<div class="empty"></div>
<button data-dir="down">⬇</button>
<div class="empty"></div>

</div>

</div>

<!-- GAME OVER -->
<div id="over" class="screen">
<h1>Game Over</h1>
<p id="final"></p>
<button onclick="backToMenu()">Voltar ao Menu</button>
</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=420;
canvas.height=420;

const menu=document.getElementById("menu");
const gameScreen=document.getElementById("gameScreen");
const over=document.getElementById("over");

let snake,food,dir,nextDir;
let score=0;
let level=1;
let speed=140;
let last=0;
let paused=false;

let high=localStorage.getItem("high")||0;
document.getElementById("high").textContent=high;

function show(s){
menu.classList.remove("active");
gameScreen.classList.remove("active");
over.classList.remove("active");
s.classList.add("active");
}

function startGame(){

snake=[
{x:10,y:10},
{x:9,y:10},
{x:8,y:10}
];

dir={x:1,y:0};
nextDir=dir;

score=0;
level=1;
speed=140;
paused=false;

document.getElementById("score").textContent=0;
document.getElementById("level").textContent=1;

spawn();
show(gameScreen);
}

function backToMenu(){
show(menu);
}

function gameOver(){

if(score>high){
high=score;
localStorage.setItem("high",high);
document.getElementById("high").textContent=high;
}

document.getElementById("final").textContent="Score: "+score;
show(over);
}

function spawn(){
food={
x:Math.floor(Math.random()*20),
y:Math.floor(Math.random()*20)
};
}

function move(){

dir=nextDir;

let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(
h.x<0||h.y<0||h.x>=20||h.y>=20||
snake.some(s=>s.x===h.x&&s.y===h.y)
){
return gameOver();
}

snake.unshift(h);

if(h.x===food.x&&h.y===food.y){

score++;
document.getElementById("score").textContent=score;

if(score%5===0){
level++;
document.getElementById("level").textContent=level;
speed=Math.max(60,speed-10);
}

spawn();

}else{
snake.pop();
}
}

function draw(){

ctx.fillStyle="#0b1220";
ctx.fillRect(0,0,420,420);

ctx.fillStyle="red";
ctx.fillRect(food.x*20,food.y*20,20,20);

snake.forEach((s,i)=>{
ctx.fillStyle=i===0?"#4ade80":"#22c55e";
ctx.fillRect(s.x*20,s.y*20,20,20);
});
}

function loop(t){

if(gameScreen.classList.contains("active") && !paused){
if(t-last>speed){
move();
last=t;
}
}

draw();
requestAnimationFrame(loop);
}

function togglePause(){
paused=!paused;
}

document.addEventListener("keydown",e=>{

if(e.key==="ArrowUp") nextDir={x:0,y:-1};
if(e.key==="ArrowDown") nextDir={x:0,y:1};
if(e.key==="ArrowLeft") nextDir={x:-1,y:0};
if(e.key==="ArrowRight") nextDir={x:1,y:0};

if(e.code==="Space") togglePause();
});

document.querySelectorAll("[data-dir]").forEach(b=>{
b.addEventListener("click",()=>{

let d=b.getAttribute("data-dir");

if(d==="up") nextDir={x:0,y:-1};
if(d==="down") nextDir={x:0,y:1};
if(d==="left") nextDir={x:-1,y:0};
if(d==="right") nextDir={x:1,y:0};

});
});

show(menu);
requestAnimationFrame(loop);

</script>

</body>
</html>
